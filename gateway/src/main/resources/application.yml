spring:
  application:
    name: gateway
  config:
    # 나머지 설정(JWT 키, CORS, Eureka 주소)은 Config Server가 설정 저장소에서 내려준다.
    # optional은 테스트에서 Config를 끌 수 있게 하려는 것. 실행 중에는 fail-fast라 Config가 꺼져 있으면 뜨지 않는다
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
  # WebFlux는 요청 처리 중 스레드가 바뀌어 로그에 traceId가 빠진다. Reactor 문맥으로 traceId를 넘겨 로그에 찍는다
  reactor:
    context-propagation: auto

server:
  port: 8000
