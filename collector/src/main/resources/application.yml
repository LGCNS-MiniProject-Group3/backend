spring:
  application:
    name: collector

server:
  port: 8083

eureka:
  client:
    service-url:
      # 로컬 기본값. compose·EC2에서는 EUREKA_URL로 바꾼다 (Config Server 이슈에서 설정 저장소로 옮김)
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # 컨테이너 안에서는 호스트 이름 대신 IP로 등록해야 다른 컨테이너가 찾아온다
    prefer-ip-address: true
