name: 스펙 변경
description: 내부 API, Kafka 메시지, DB 테이블, 외부 API를 바꿀 때
title: "[스펙] "
labels: ["spec-change"]
body:
  - type: markdown
    attributes:
      value: 다른 담당자의 코드에 영향을 주는 변경이에요. 병합 전에 영향받는 사람 모두가 확인해야 해요.
  - type: dropdown
    id: kind
    attributes:
      label: 무엇을 바꾸나요
      multiple: true
      options:
        - 내부 API (/internal/**)
        - Kafka 토픽 · 메시지 DTO
        - DB 테이블
        - 외부 API (/api/**)
        - 헤더 · 오류 응답 형식
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 대상
      placeholder: 예) ⑤ GET /internal/posts/{postId}/guide-input, recu.guide.created
    validations:
      required: true
  - type: textarea
    id: before-after
    attributes:
      label: 바꾸기 전 → 후
      description: 필드 이름, 타입, 경로를 그대로 적어 주세요.
      render: json
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 왜 바꾸나요
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: 영향받는 담당자
      description: 확인하면 체크해 주세요.
      value: |
        - [ ] 1번 Gateway · 인프라
        - [ ] 2번 user · bookmark
        - [ ] 3번 content 조회
        - [ ] 4번 content 수신
        - [ ] 5번 collector · 로컬
        - [ ] 6번 guide · Kafka
        - [ ] 7번 CI/CD · 테스트
    validations:
      required: true
