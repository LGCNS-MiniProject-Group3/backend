global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  # 업무 서비스 5개와 Gateway는 Eureka에 등록된 실제 주소로 수집해요.
  - job_name: recu-services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://discovery:8761/eureka
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_eureka_app_instance_status]
        regex: UP
        action: keep
      - source_labels: [__meta_eureka_app_name]
        regex: '(?i:gateway|user|content|collector|guide|bookmark)'
        action: keep

  # Discovery와 Config는 Eureka에 등록하지 않아 고정 주소로 수집해요.
  - job_name: recu-infrastructure
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['discovery:8761']
      - targets: ['config:8888']

  # Kafka는 스스로 지표를 내지 않아 kafka-exporter가 대신 읽어 줘요.
  # job 이름을 recu-로 시작하지 않아 서비스 상태(up{job=~"recu-.*"})에는 섞이지 않아요.
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']
