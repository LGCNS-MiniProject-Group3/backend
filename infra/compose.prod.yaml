# 7번 담당 — prod(EC2) 실행. 서비스 8개 + Kafka. DB는 RDS라 여기 없다
# 설계: docs/design.md 9장(기동 순서, 비밀 값), 10장(배포 대상)
#
# EC2의 /opt/recu 에 이 파일과 .env 를 둔다. 이미지는 EC2에서 빌드하지 않고 ECR에서 받는다
#   IMAGE_TAG=<커밋 SHA> docker compose -f compose.prod.yaml pull
#   IMAGE_TAG=<커밋 SHA> docker compose -f compose.prod.yaml up -d
# 배포는 cd.yml이 SSM Run Command로 위 명령을 보낸다. 이 파일을 고치면 EC2에 다시 복사한다
#
# .env (EC2에서만 만든다. 값은 이슈·PR·채팅에 적지 않는다)
#   ECR_REGISTRY       <계정ID>.dkr.ecr.ap-northeast-2.amazonaws.com
#   ENCRYPT_KEY        설정 저장소 '{cipher}' 복호화 키 (1번이 전달)
#   CONFIG_REPO_URI    설정 저장소 주소
#   CONFIG_REPO_TOKEN  설정 저장소 읽기 전용 토큰 (1번이 전달)
#   OPENAI_API_KEY     guide·collector의 OpenAI 키. 비우면 AI 호출만 실패
#
# Kafka·Eureka·RDS 주소는 설정 저장소의 prod 프로필에서 받는다.
# 이 파일의 서비스 이름(kafka:9092, discovery:8761)과 맞아야 한다

name: recu

# 서비스마다 같은 설정. 힙 상한은 design.md 10장(256m~384m)
# JAVA_TOOL_OPTIONS는 Dockerfile 값을 통째로 덮어쓰므로 인코딩·시간대도 다시 적는다
x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-java-256: &java-256 "-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xmx256m"
x-java-384: &java-384 "-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul -Xmx384m"

# 각 서비스가 Config Server에서 prod 설정을 받는다
x-client-env: &client-env
  SPRING_PROFILES_ACTIVE: prod
  CONFIG_URL: http://config:8888

# Config·Eureka·Kafka가 준비된 뒤에 뜬다 (design.md 9장 기동 순서)
x-client-depends: &client-depends
  config:
    condition: service_healthy
  discovery:
    condition: service_healthy
  kafka:
    condition: service_healthy

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  kafka:
    <<: *app
    image: apache/kafka:3.8.1
    # 포트를 열지 않는다. 컨테이너끼리만 kafka:9092로 쓴다
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  config:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-config:${IMAGE_TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: *java-256
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:?Set CONFIG_REPO_URI in .env}
      CONFIG_REPO_TOKEN: ${CONFIG_REPO_TOKEN:?Set CONFIG_REPO_TOKEN in .env}
      ENCRYPT_KEY: ${ENCRYPT_KEY:?Set ENCRYPT_KEY in .env}
      # Config Server는 설정 저장소를 읽지 않아서 Bus용 Kafka 주소를 여기서 받는다 (design.md 9장)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Bus 때문에 Kafka에 붙는다. Kafka보다 먼저 뜨면 연결 재시도 로그가 쌓이고 health가 늦게 UP이 된다
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]

  discovery:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-discovery:${IMAGE_TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: *java-256
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]

  user:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-user:${IMAGE_TAG:-latest}
    environment:
      <<: *client-env
      JAVA_TOOL_OPTIONS: *java-384
    depends_on: *client-depends
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]

  content:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-content:${IMAGE_TAG:-latest}
    environment:
      <<: *client-env
      JAVA_TOOL_OPTIONS: *java-384
    depends_on: *client-depends
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]

  collector:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-collector:${IMAGE_TAG:-latest}
    environment:
      <<: *client-env
      JAVA_TOOL_OPTIONS: *java-384
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: *client-depends
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]

  guide:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-guide:${IMAGE_TAG:-latest}
    environment:
      <<: *client-env
      JAVA_TOOL_OPTIONS: *java-384
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: *client-depends
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]

  bookmark:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-bookmark:${IMAGE_TAG:-latest}
    environment:
      <<: *client-env
      JAVA_TOOL_OPTIONS: *java-384
    depends_on: *client-depends
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]

  # 외부에 여는 포트는 Gateway 8000 하나 (design.md 10장 보안 그룹)
  gateway:
    <<: *app
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY in .env}/recu-gateway:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      <<: *client-env
      JAVA_TOOL_OPTIONS: *java-256
    depends_on:
      <<: *client-depends
      user:
        condition: service_healthy
      content:
        condition: service_healthy
      collector:
        condition: service_healthy
      guide:
        condition: service_healthy
      bookmark:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/actuator/health"]
