# 5번 담당 — 로컬 local/dev 인프라 (MariaDB · Kafka)
# 서비스 이름 mariadb / kafka 는 config application-dev.yml 과 동일해야 함
# 앱·gateway 는 이후 추가. 지금은 인프라만.

name: recu

services:
  mariadb:
    image: mariadb:11.4
    container_name: recu-mariadb
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
      # compose 파일 기준 상대경로 → infra/db
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka:
    image: apache/kafka:3.8.1
    container_name: recu-kafka
    ports:
      # 호스트 9092 → 컨테이너 EXTERNAL(9094). IDE(local)는 계속 localhost:9092
      - "127.0.0.1:9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      # INTERNAL: compose 안 서비스(dev) → kafka:9092 (설정 저장소 application.yml과 같은 포트)
      # EXTERNAL: 호스트 IDE(local) → localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:
