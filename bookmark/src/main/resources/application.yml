spring:
  application:
    name: bookmark

  # DB 접속 정보는 실행 환경 변수로 받는다. Config Server(#8)가 생기면 설정 저장소로 옮긴다
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 표는 infra/db/의 SQL로 만들고 JPA는 맞는지 확인만 한다 (docs/code-convention.md DB · JPA)
      ddl-auto: validate

server:
  port: 8085

eureka:
  client:
    service-url:
      # 로컬 기본값. compose·EC2에서는 EUREKA_URL로 바꾼다 (Config Server 이슈에서 설정 저장소로 옮김)
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # 컨테이너 안에서는 호스트 이름 대신 IP로 등록해야 다른 컨테이너가 찾아온다
    prefer-ip-address: true
