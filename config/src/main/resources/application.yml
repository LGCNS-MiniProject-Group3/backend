spring:
  application:
    name: config
  cloud:
    config:
      server:
        git:
          # private 설정 저장소. 주소와 읽기 전용 토큰은 .env에서 받는다 (.env.example)
          uri: ${CONFIG_REPO_URI}
          username: recu                  # GitHub는 토큰만 맞으면 사용자 이름은 아무 값이나 받는다
          password: ${CONFIG_REPO_TOKEN}
          default-label: main
          # 뜰 때 저장소를 받아 본다. 주소·토큰이 틀리면 첫 요청이 아니라 기동 때 실패한다
          clone-on-start: true

# 설정 저장소의 '{cipher}…' 값을 풀어서 내려준다. 같은 키로 /encrypt를 불러 값을 암호화한다
encrypt:
  key: ${ENCRYPT_KEY}

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health
